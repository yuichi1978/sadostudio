<dl class="c-form__item">
  <dt class="c-form__head">氏名<span class="p-contact__required">*</span></dt>
  <dd class="c-form__content">[text* your-name placeholder "山田　太郎"]</dd>
</dl>
<dl class="c-form__item">
  <dt class="c-form__head">メールアドレス<span class="p-contact__required">*</span></dt>
  <dd class="c-form__content">[email* your-email placeholder "test@xxxxxx.co.jp"]</dd>
</dl>
<dl class="c-form__item">
  <dt class="c-form__head">電話番号</dt>
  <dd class="c-form__content">[tel* your-phone placeholder "0000-000-0000"]</dd>
</dl>
<dl class="c-form__item">
  <dt class="c-form__head">お問い合わせ<span class="p-contact__required">*</span></dt>
  <dd class="c-form__content">[textarea* contact-detail placeholder "お問い合わせ内容をお書きください。"]</dd>
</dl>

<div class="c-form__attention">
  <p class="c-form__attention-text">*は必須項目です。</p>
</div>
<div class="c-send__btn">[submit class:c-linkbtn "SEND"]</div>
